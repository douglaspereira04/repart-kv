# YCSB-E mix (95% scan / 5% insert, Zipfian).
# Payload: 4,194,304 records * 4096 B = 16 GiB of values.
# The original ycsb_e.toml is 1M records with gen_values=false (1 KiB default).
workload.n_records = 4194304
workload.n_operations = 10000000

workload.key_seed = 1908944376
workload.operation_seed = 1836524827
workload.scan_seed = 2239123249


workload.single_distribution = true
workload.data_distribution = "ZIPFIAN"
workload.scan_length_distribution = "UNIFORM"
workload.read_proportion = 0.0
workload.update_proportion = 0.0
workload.scan_proportion = 0.95
workload.insert_proportion = 0.05

workload.min_scan_length = 1
workload.max_scan_length = 100

workload.gen_values = true
workload.value_min_size = 4096
workload.value_max_size = 4096

# export
export = true
output.requests.export_path = "requests.txt"
